  caption: |
    Every sleuth has a first teacher. Callie Thorne's was her mother, Eleanor, who put a brass magnifying glass in her daughter's hand at nine years old and never once had to explain what it was for.

    The glass is still on the oak table in the back room of The Foxed Page, balanced for a woman's hand.

    Who taught you to look closely?
