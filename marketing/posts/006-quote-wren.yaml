social:
  caption: |
    One hundred and eighty years ago, a surveyor was made to file a map he knew was false.

    So he hid the true line where only a reader would think to look, and set down this confession in the margins — abbreviated, letter-substituted, patient. He assumed that someday, someone would come along who read the way he did.

    He was right. It just took a while.

    Have you ever left a note you hoped exactly one person would find?
