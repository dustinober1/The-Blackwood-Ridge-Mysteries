headline: "RALSTON HALL"
sub: "The house on the hill is open for tours. The family is generous, the portraits are watchful, and every brick of it was paid for twice."

social:
  caption: |
    Every town has a house it is proud of. Blackwood Ridge has a house it is proud of and quiet about, which is not the same thing.

    The Ralstons built the town's gratitude brick by brick — the library wing, the church roof, the historical society that preserves the town's history in a building their money paid for. Generosity is a kind of architecture. It holds up the roof, and it also holds the doors.

    The tour runs Thursdays. The portrait gallery is the highlight. The patriarch's eyes follow you; the docent will tell you it's the paint.

    Charity with strings attached, or just history? Would you take the tour?
