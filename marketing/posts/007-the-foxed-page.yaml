social:
  caption: |
    A foxed page is one spotted by age — the brown freckles time leaves on old paper. The shop on the square is named for exactly that: the beauty of what time does to paper, and what paper does to the people who keep it.

    Callie Thorne lives above it, works in the back room behind it, and found the town's oldest lie shelved in it. The shop has been a bookshop for over a hundred years. It intends to stay one.

    Tell us about the shop that raised you — the one with the cat, the ladder, and the books you'd never find on a website.
