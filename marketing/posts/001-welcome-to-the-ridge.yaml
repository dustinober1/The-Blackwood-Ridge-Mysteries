social:
  caption: |
    Welcome to Blackwood Ridge.

    This is the town's page, not a tour brochure. Expect the square, the shop, the archives, and the occasional case file from the county records room. Some of it is lovely. Some of it is the kind of lovely that makes you check the locks.

    If you're new here: the mysteries begin with The Annotated Murder, on Kindle and Audible. If you've already read it, you know what the town would rather you didn't.

    Pull up a bench under the oaks. The gas lamps come on at dusk.

    How did you find us — a margin note, a bookshop window, or plain old gossip?
