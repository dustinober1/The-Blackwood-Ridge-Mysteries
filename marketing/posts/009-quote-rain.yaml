social:
  caption: |
    Chapter one, opening night. Before the auction, before the body, there is just Callie, the shop, her mother's tea, and rain that behaves like a visitor who knows it will be let in.

    Some chapters set a scene. This one sets a trap you're happy to walk into.

    Cozy readers, you know the feeling: what's the last book whose weather you wanted to live in?
