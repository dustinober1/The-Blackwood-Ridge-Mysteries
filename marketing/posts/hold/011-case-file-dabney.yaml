social:
  caption: |
    Marguerite Dabney taught school in Blackwood Ridge for thirty-two years, and for thirty-two years she said nothing at all about what happened to the girl who never came home.

    She said it in peonies instead, in a garden planted in the old language of flowers, arranged for the one reader she trusted to catch it.

    The hand in the margins has a name. Book Two is her confession.

    Would you have caught the garden's message — or walked past it every morning like the rest of the town?
