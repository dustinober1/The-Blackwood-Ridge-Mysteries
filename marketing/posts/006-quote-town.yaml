social:
  caption: |
    The cost of telling the truth in a small town isn't anger. Anger would be easier — anger you can answer.

    Book Two opens eight months after Callie pulled the thread, with a town that wishes she hadn't and a garden that has been trying to say something for thirty-two years.

    Have you ever been the person who said the thing?
