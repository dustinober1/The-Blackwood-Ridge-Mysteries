# The Chekhov Ledger — setups awaiting payoff (The Botanical Confession)
#
# Deferred setups (P008-P012) are tracked in the series promise map:
# series-outline.md SS Deferred promise map (canonical since 2026-10-12).
#
# Retrofitted from the finished pre-publication book's chapter notes
# (reverse-scaffold import, 2026-10-11). Book 2 pays most of its own promises
# and plants the series' next doors (Beech, the records dispute, the
# apprenticeship, the vow).

promises:
  - id: "P001"
    promise: "The cipher itself — a sentence built out of flowers 'she could not bring herself to write in plain words.'"
    introduced_ch: 1
    kind: "mystery"
    weight: "loud"
    payoff_by_ch: 5
    paid_in_ch: 5
    paid_how: "The map completes: the wet hemline, the Harlow-barn lie, 'The old dock. The deep.' — and the imperative 'Say it.'"
    deferred_to_series: false
    notes: ""
  - id: "P002"
    promise: "Marguerite's aim — the estate directed to The Foxed Page, 'the annotated one to be priced by you personally.'"
