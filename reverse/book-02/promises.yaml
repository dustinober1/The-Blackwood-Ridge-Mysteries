    kind: "relationship"
    weight: "plain"
    payoff_by_ch: 5
    paid_in_ch: 5
    paid_how: "Mae's confession of the October visit confirms the book was meant for Callie; 'Say it.' received and obeyed."
    deferred_to_series: false
    notes: ""
  - id: "P003"
    promise: "Doris's demand — 'bring it to me... Not the sheriff. Not the town. Me.'"
    introduced_ch: 2
    kind: "debt"
    weight: "loud"
    payoff_by_ch: 8
    paid_in_ch: 8
    paid_how: "Broken (the search, then the news via Mae) and receipted in the kitchen reckoning; 'there was nothing she could say that would unbreak it' — and the grief moves anyway."
    deferred_to_series: false
    notes: "The breaking is deliberate — the book's cost is that the demand could not be kept."
