motifs:
  - motif: "bergamot tea ritual"
    phrasings: ["bergamot", "the same tin", "three-minute steep", "Eleanor's mug"]
    intent: "Remembrance disguised as habit; its taste tracks whether Callie is present in her own life."
    chapters: [1, 2, 6, 8]
  - motif: "the floorboard"
    phrasings: ["stepped over the floorboard", "the courtesy of not waking her"]
    intent: "Grief as habit; ch8's deliberate step-on marks choosing the living over the ghost."
    chapters: [1, 2, 3, 4, 5, 6, 8]
  - motif: "rain on windows"
    phrasings: ["the rain", "tapping the glass", "the sound of safety"]
    intent: "Inside vs. outside; the safety reading is re-negotiated by the end."
    chapters: [1, 2, 3, 4, 5, 6, 7, 8]
  - motif: "margins as voices"
    phrasings: ["the pressure of the hand", "the room narrowed", "margin notes"]
    intent: "Handwriting carries the living presence of writers; the series' core mechanism."
    chapters: [1, 2, 3, 4, 5, 8]
  - motif: "reading hands"
    phrasings: ["She had read hands", "effortful stillness", "louder than any tremor"]
    intent: "Callie reads people as documents; over-control, not tremor, is the tell (Gus canon)."
    chapters: [1, 3, 5, 7]
  - motif: "lavender"
    phrasings: ["lavender", "the smell of sachets"]
    intent: "Mae's warmth as armor; the smell that will not wash out of the coat."
    chapters: [2, 4, 7, 8]
