name: Book 5 release package

"on":
  pull_request:
    paths:
      - "books/book-05/**"
      - "progress.yaml"
      - "series-outline.md"
      - ".github/workflows/book-05-release-package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cover_ready: ${{ steps.preflight.outputs.cover_ready }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install readiness dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir Pillow==12.0.0

      - name: Run readiness regression tests
        run: python books/book-05/package/test_validate_readiness.py

      - name: Validate Book 5 package readiness
        id: preflight
        shell: bash
        run: |
          set +e
          python books/book-05/package/validate-readiness.py \
            --json books/book-05/package/package-validation.json \
            --report books/book-05/package/package-validation.md
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "cover_ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("books/book-05/package/package-validation.json").read_text(encoding="utf-8"))
          blockers = result.get("blockers", [])
          if len(blockers) != 1 or not blockers[0].startswith("Missing or unapproved ebook cover:"):
              raise SystemExit("Unexpected Book 5 package blocker(s): " + repr(blockers))
          PY
            echo "cover_ready=false" >> "$GITHUB_OUTPUT"
            echo "Book 5 remains correctly blocked only by the missing or unapproved cover; no release package will be built."
          else
            exit "$status"
          fi
          cat books/book-05/package/package-validation.md

      - name: Upload readiness report
        uses: actions/upload-artifact@v4
        with:
          name: book-05-package-readiness
          path: |
            books/book-05/package/package-validation.md
            books/book-05/package/package-validation.json
          if-no-files-found: error
          retention-days: 30

  build-and-validate:
    needs: readiness
    if: needs.readiness.outputs.cover_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils fonts-liberation
          if apt-cache show epubcheck >/dev/null 2>&1; then
            sudo apt-get install -y epubcheck
          else
            echo "epubcheck is required for final release validation" >&2
            exit 1
          fi
          python -m pip install --disable-pip-version-check --no-cache-dir \
            PyYAML==6.0.2 \
            beautifulsoup4==4.13.4 \
            python-docx==1.2.0 \
            Pillow==12.0.0 \
            pypdf==6.1.1

      - name: Build and validate Book 5 release package
        run: python books/book-05/export/run-release.py

      - name: Commit stable retailer release files
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          RELEASE_DIR="books/book-05/release"
          DIST="books/book-05/export/dist"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$DIST/The-Planted-Page.epub" "$RELEASE_DIR/The-Planted-Page.epub"
          cp "$DIST/The-Planted-Page-cover.jpg" "$RELEASE_DIR/The-Planted-Page-cover.jpg"
          cp books/book-05/publish/upload-package.md "$RELEASE_DIR/The-Planted-Page-KDP-upload-sheet.md"
          cp books/book-05/listing/listing-copy.md "$RELEASE_DIR/The-Planted-Page-listing-copy.md"
          cp books/book-05/listing/retailer-description.html "$RELEASE_DIR/The-Planted-Page-retailer-description.html"
          cp books/book-05/listing/retailer-description.txt "$RELEASE_DIR/The-Planted-Page-retailer-description.txt"
          cp "$DIST/release-manifest.json" "$RELEASE_DIR/release-manifest.json"
          cp "$DIST/release-validation.md" "$RELEASE_DIR/release-validation.md"
          cp "$DIST/The-Planted-Page-upload-package.zip" "$RELEASE_DIR/The-Planted-Page-retailer-upload-package.zip"

          cat > "$RELEASE_DIR/README.md" <<'README'
          # The Planted Page — Retailer Release Files

          **Status:** Package validated for manual upload; not yet published.

          This directory is created only after the approved cover and final release pipeline pass. Publication remains pending until retailer acceptance and a live detail page are confirmed.
          README

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$RELEASE_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Add Book 5 retailer release files"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: book-05-release-package
          path: |
            books/book-05/export/dist/The-Planted-Page-upload-package.zip
            books/book-05/export/dist/The-Planted-Page.epub
            books/book-05/export/dist/The-Planted-Page-cover.jpg
            books/book-05/export/dist/The-Planted-Page.docx
            books/book-05/export/dist/release-manifest.json
            books/book-05/export/dist/release-validation.md
            books/book-05/export/qa/contact-sheets/*.png
          if-no-files-found: error
          retention-days: 30
