<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2400" viewBox="0 0 2400 2400">

  <defs>
    <!-- Background Vignette Gradient -->
    <radialGradient id="vignetteGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#230C21" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#190818" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#090408" stop-opacity="1.0" />
    </radialGradient>

    <!-- Brass Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D898" />
      <stop offset="35%" stop-color="#CC9E40" />
      <stop offset="70%" stop-color="#F2D898" />
      <stop offset="100%" stop-color="#8C631B" />
    </linearGradient>

    <!-- Horizontal Brass Rule Gradient -->
    <linearGradient id="brassHGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CC9E40" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#F2D898" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#CC9E40" stop-opacity="1.0" />
      <stop offset="75%" stop-color="#F2D898" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#CC9E40" stop-opacity="0.1" />
    </linearGradient>

    <!-- Open Book Left Page Gradient -->
    <linearGradient id="pageLeftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8C7AD" />
      <stop offset="12%" stop-color="#F4ECE1" />
      <stop offset="85%" stop-color="#F4ECE1" />
      <stop offset="100%" stop-color="#D8C7AD" stop-opacity="0.8" />
    </linearGradient>

    <!-- Open Book Right Page Gradient -->
    <linearGradient id="pageRightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8C7AD" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#F4ECE1" />
      <stop offset="88%" stop-color="#F4ECE1" />
      <stop offset="100%" stop-color="#D8C7AD" />
    </linearGradient>

    <!-- Magnifying Glass Bezel Metallic Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D898" />
      <stop offset="30%" stop-color="#CC9E40" />
      <stop offset="55%" stop-color="#FFF2BD" />
      <stop offset="80%" stop-color="#8C631B" />
      <stop offset="100%" stop-color="#52370A" />
    </linearGradient>

    <!-- Wooden Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D170B" />
      <stop offset="45%" stop-color="#6B3718" />
      <stop offset="75%" stop-color="#4A2610" />
      <stop offset="100%" stop-color="#1B0C05" />
    </linearGradient>

    <!-- Lens Glass Reflection Gradient -->
    <linearGradient id="lensReflection" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#C2DCF2" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25" />
    </linearGradient>

    <!-- Warm Amber Glow from Unseen Lantern -->
    <radialGradient id="lampGlow" cx="60%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFA834" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#D97706" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="14" dy="22" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>


  <!-- Background -->
  <rect width="2400" height="2400" fill="url(#vignetteGrad)" />

  <!-- Top Title Panel -->
  <rect x="0" y="60" width="2400" height="760" fill="#190818" opacity="0.88" />

  <!-- Bottom Author/Narrator Panel -->
  <rect x="0" y="1960" width="2400" height="440" fill="#090408" opacity="0.95" />

  <!-- Central Archival Illustration (Optimized for Square Canvas) -->
  
  <g id="illustration-group" transform="translate(1200, 1380) scale(1.35)">
    <!-- Ambient Warm Lantern Glow -->
    <ellipse cx="60" cy="-20" rx="640" ry="460" fill="url(#lampGlow)" />

    <!-- Open Book Shadow -->
    <ellipse cx="0" cy="220" rx="540" ry="60" fill="#000000" opacity="0.6" filter="url(#shadowFilter)" />

    <!-- Outer Leather Binding / Book Cover Edges -->
    <rect x="-530" y="-210" width="1060" height="420" rx="16" fill="#2E180E" stroke="#4A2616" stroke-width="4" />
    <rect x="-525" y="-205" width="1050" height="410" rx="12" fill="#1C0D07" />

    <!-- Gilded Edge Trim -->
    <path d="M -520,-200 L 520,-200 L 526,200 L -526,200 Z" fill="#6B4B1B" opacity="0.5" />

    <!-- Left Open Page -->
    <path d="M -505,-190 C -360,-200 -180,-195 -10,-182 L -10,188 C -180,180 -360,182 -505,195 Z"
          fill="url(#pageLeftGrad)" stroke="#C7B295" stroke-width="1.5" filter="url(#shadowFilter)" />

    <!-- Right Open Page -->
    <path d="M 10,-182 C 180,-195 360,-200 505,-190 L 505,195 C 360,182 180,180 10,188 Z"
          fill="url(#pageRightGrad)" stroke="#C7B295" stroke-width="1.5" filter="url(#shadowFilter)" />

    <!-- Book Gutter Shadow -->
    <rect x="-14" y="-185" width="28" height="375" fill="#000000" opacity="0.32" />
    <line x1="0" y1="-185" x2="0" y2="190" stroke="#8C6E4A" stroke-width="2.5" />

    <!-- Left Page: Faint Historical Ledger Lines and Entries -->
    <g opacity="0.75">
      <!-- Ledger Header -->
      <text x="-480" y="-155" font-family="Baskerville, 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#3B2215" letter-spacing="2px">BLACKWOOD RIDGE HISTORICAL REGISTER • 1842</text>
      <line x1="-480" y1="-146" x2="-40" y2="-146" stroke="#3B2215" stroke-width="1" opacity="0.6" />
      <line x1="-480" y1="-142" x2="-40" y2="-142" stroke="#3B2215" stroke-width="0.5" opacity="0.4" />

      <!-- Columns -->
      <line x1="-390" y1="-142" x2="-390" y2="160" stroke="#CBB99E" stroke-width="0.8" />
      <line x1="-220" y1="-142" x2="-220" y2="160" stroke="#CBB99E" stroke-width="0.8" />

      <!-- Sample Handwritten Ledger Rows -->
      <text x="-475" y="-115" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215" opacity="0.85">Oct 4</text>
      <text x="-375" y="-115" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215" opacity="0.85">Lot 14: Ridge Parcel</text>
      <text x="-205" y="-115" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215" opacity="0.85">140 Acres / Survey Sealed</text>

      <text x="-475" y="-80" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215" opacity="0.85">Oct 9</text>
      <text x="-375" y="-80" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215" opacity="0.85">Minister E. Townsend</text>
      <text x="-205" y="-80" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215" opacity="0.85">Non casus. Equus, via nota.</text>

      <text x="-475" y="-45" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215" opacity="0.85">Oct 16</text>
      <text x="-375" y="-45" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215" opacity="0.85">Pike Inquiry Rec.</text>
      <text x="-205" y="-45" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215" opacity="0.85">Iudex emptus. S.R. iussit.</text>

      <!-- Faded Hand-drawn Margin Note (Eleanor's / Callie's finding) -->
      <g transform="translate(-485, 30) rotate(-4)">
        <path d="M 0,0 C 30,-8 90,-4 130,-12" fill="none" stroke="#3B2215" stroke-width="1.8" opacity="0.6" />
        <text x="10" y="-16" font-family="Baskerville, Georgia, serif" font-style="italic" font-weight="bold" font-size="16" fill="#6B2814">
          † Linea vera abest tres gradus...
        </text>
        <text x="12" y="16" font-family="Baskerville, Georgia, serif" font-size="13" fill="#6B2814" opacity="0.9">
          (the true line lies three degrees off)
        </text>
      </g>
    </g>

    <!-- Right Page: Margin Annotation with Tea Stain -->
    <g>
      <!-- Subtle Text Columns on Right Page -->
      <g opacity="0.65">
        <text x="40" y="-155" font-family="Baskerville, 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" font-weight="bold" fill="#3B2215" letter-spacing="2px">CATALOGUE OF COUNTY ACQUISITIONS</text>
        <line x1="40" y1="-146" x2="480" y2="-146" stroke="#3B2215" stroke-width="1" opacity="0.6" />
        <text x="45" y="-115" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215">Folio 82: Keystone transcriptions by J. Wren.</text>
        <text x="45" y="-80" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215">Surveyor's Prayer inscribed at north lintel.</text>
        <text x="45" y="-45" font-family="Baskerville, Georgia, serif" font-size="13" fill="#3B2215">The Ralston lot (1962 donation) remains intact.</text>
      </g>

      <!-- The Bergamot Tea Stain (Tannin Ring on Lower Corner) -->
      <g transform="translate(390, 85)">
        <ellipse cx="0" cy="0" rx="55" ry="46" fill="none" stroke="#7A431E" stroke-width="5" opacity="0.32" />
        <ellipse cx="0" cy="0" rx="49" ry="41" fill="#7A431E" opacity="0.14" />
        <ellipse cx="3" cy="-2" rx="42" ry="34" fill="#7A431E" opacity="0.08" />
        <circle cx="58" cy="18" r="4" fill="#7A431E" opacity="0.25" />
        <circle cx="68" cy="28" r="2.5" fill="#7A431E" opacity="0.2" />
      </g>

      <!-- Crimson Silk Bookmark Ribbon flowing across right page -->
      <path d="M 0,-185 C 30,-80 80,40 140,195 C 155,200 170,192 180,185 C 130,50 80,-70 20,-185 Z"
            fill="#8A1C24" opacity="0.9" />
      <path d="M 12,-180 C 40,-75 90,45 150,190" stroke="#B8444E" stroke-width="1.5" fill="none" opacity="0.7" />
    </g>

    <!-- The Brass Magnifying Glass (Angled over crucial text) -->
    <g transform="translate(180, 20) rotate(-32)" filter="url(#glassShadow)">
      <!-- Turned Hardwood Handle -->
      <g transform="translate(0, 140)">
        <path d="M -16,0 L 16,0 L 22,220 C 22,250 14,270 0,270 C -14,270 -22,250 -22,220 Z" fill="url(#handleGrad)" />
        <!-- Brass Rings & Collars on Handle -->
        <rect x="-18" y="0" width="36" height="14" rx="3" fill="url(#bezelGrad)" />
        <rect x="-20" y="30" width="40" height="8" rx="2" fill="url(#bezelGrad)" />
        <rect x="-22" y="120" width="44" height="10" rx="3" fill="url(#bezelGrad)" />
        <circle cx="0" cy="270" r="14" fill="url(#bezelGrad)" />
      </g>

      <!-- Outer Heavy Brass Bezel Rim -->
      <circle cx="0" cy="0" r="146" fill="url(#bezelGrad)" stroke="#52370A" stroke-width="3" />
      <circle cx="0" cy="0" r="132" fill="#F2D898" opacity="0.8" />
      <circle cx="0" cy="0" r="126" fill="#52370A" />

      <!-- Inner Magnified View Area -->
      <circle cx="0" cy="0" r="124" fill="#F4ECE1" />

      <!-- Magnified Text Under Lens -->
      <g transform="translate(-108, -35)">
        <rect x="0" y="-18" width="216" height="74" fill="#FFF8EA" opacity="0.6" rx="4" />
        <text x="108" y="0" font-family="Baskerville, 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="21" font-weight="bold" fill="#1C0D05" text-anchor="middle">
          LINEA VERA ABEST
        </text>
        <text x="108" y="26" font-family="Baskerville, 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#752912" text-anchor="middle">
          tres gradus ab inscripta
        </text>
        <line x1="20" y1="36" x2="196" y2="36" stroke="#9E3B1D" stroke-width="1.8" />
      </g>

      <!-- Glass Convex Lens Shimmer / Refraction Overlay -->
      <circle cx="0" cy="0" r="124" fill="url(#lensReflection)" />

      <!-- Optical Glare Arc -->
      <path d="M -90,-80 A 120,120 0 0,1 80,-90 A 108,108 0 0,0 -80,-60 Z" fill="#FFFFFF" opacity="0.55" />
    </g>
  </g>


  <!-- Signature Double Brass Keylines -->
  <!-- Outer Keyline (50px inset, 5px stroke) -->
  <rect x="50" y="50" width="2300" height="2300" fill="none" stroke="url(#brassGrad)" stroke-width="5" />
  <!-- Inner Keyline (72px inset, 1.8px stroke) -->
  <rect x="72" y="72" width="2256" height="2256" fill="none" stroke="url(#brassGrad)" stroke-width="1.8" opacity="0.9" />

  <!-- Corner Filigree -->
  
    <g transform="translate(78, 78) scale(1, 1)">
      <path d="M 0,0 L 76,0 C 38.0,0 22.8,15.200000000000001 15.200000000000001,22.8 C 15.200000000000001,38.0 0,38.0 0,76 Z" fill="url(#brassGrad)" opacity="0.85" />
      <circle cx="26.599999999999998" cy="26.599999999999998" r="6.08" fill="#F2D898" />
      <path d="M 6,6 L 53.199999999999996,6 C 30.400000000000002,6 19.0,11.4 11.4,19.0 C 11.4,30.400000000000002 6,30.400000000000002 6,53.199999999999996 Z" fill="none" stroke="#CC9E40" stroke-width="1.5" />
    </g>
    
  
    <g transform="translate(2322, 78) scale(-1, 1)">
      <path d="M 0,0 L 76,0 C 38.0,0 22.8,15.200000000000001 15.200000000000001,22.8 C 15.200000000000001,38.0 0,38.0 0,76 Z" fill="url(#brassGrad)" opacity="0.85" />
      <circle cx="26.599999999999998" cy="26.599999999999998" r="6.08" fill="#F2D898" />
      <path d="M 6,6 L 53.199999999999996,6 C 30.400000000000002,6 19.0,11.4 11.4,19.0 C 11.4,30.400000000000002 6,30.400000000000002 6,53.199999999999996 Z" fill="none" stroke="#CC9E40" stroke-width="1.5" />
    </g>
    
  
    <g transform="translate(78, 2322) scale(1, -1)">
      <path d="M 0,0 L 76,0 C 38.0,0 22.8,15.200000000000001 15.200000000000001,22.8 C 15.200000000000001,38.0 0,38.0 0,76 Z" fill="url(#brassGrad)" opacity="0.85" />
      <circle cx="26.599999999999998" cy="26.599999999999998" r="6.08" fill="#F2D898" />
      <path d="M 6,6 L 53.199999999999996,6 C 30.400000000000002,6 19.0,11.4 11.4,19.0 C 11.4,30.400000000000002 6,30.400000000000002 6,53.199999999999996 Z" fill="none" stroke="#CC9E40" stroke-width="1.5" />
    </g>
    
  
    <g transform="translate(2322, 2322) scale(-1, -1)">
      <path d="M 0,0 L 76,0 C 38.0,0 22.8,15.200000000000001 15.200000000000001,22.8 C 15.200000000000001,38.0 0,38.0 0,76 Z" fill="url(#brassGrad)" opacity="0.85" />
      <circle cx="26.599999999999998" cy="26.599999999999998" r="6.08" fill="#F2D898" />
      <path d="M 6,6 L 53.199999999999996,6 C 30.400000000000002,6 19.0,11.4 11.4,19.0 C 11.4,30.400000000000002 6,30.400000000000002 6,53.199999999999996 Z" fill="none" stroke="#CC9E40" stroke-width="1.5" />
    </g>
    

  <!-- Series Header -->
  <g id="series-header">
    <text x="1200" y="148" font-family="Baskerville, 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="#F2D898" text-anchor="middle" letter-spacing="5px">
      THE BLACKWOOD RIDGE MYSTERIES  •  BOOK 1
    </text>
    <line x1="420" y1="205" x2="1980" y2="205" stroke="url(#brassHGrad)" stroke-width="2.5" />
    <polygon points="1193,205 1200,198 1207,205 1200,212" fill="#F2D898" />
  </g>

  <!-- Title Lockup -->
  <g id="title-group">
    <!-- Line 1: The -->
    <text x="1200" y="340" font-family="Baskerville, Georgia, serif" font-style="italic" font-size="124" fill="#F7F1E1" text-anchor="middle" letter-spacing="3px">
      The
    </text>
    <!-- Line 2: Annotated -->
    <text x="1200" y="520" font-family="Baskerville, 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="172" font-weight="bold" fill="#F7F1E1" text-anchor="middle" letter-spacing="5px">
      ANNOTATED
    </text>
    <!-- Line 3: Murder -->
    <text x="1200" y="705" font-family="Baskerville, 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="172" font-weight="bold" fill="#F7F1E1" text-anchor="middle" letter-spacing="5px">
      MURDER
    </text>

    <!-- Brass Rule Under Title -->
    <line x1="560" y1="785" x2="1840" y2="785" stroke="url(#brassHGrad)" stroke-width="2.5" />
    <polygon points="1192,785 1200,777 1208,785 1200,793" fill="#F2D898" />
  </g>

  <!-- Bottom Lockup: Author and Narrator Annie Caldwell -->
  <g id="bottom-credits">
    <!-- Top Divider -->
    <line x1="580" y1="2010" x2="1820" y2="2010" stroke="url(#brassHGrad)" stroke-width="2.2" />
    <polygon points="1194,2010 1200,2004 1206,2010 1200,2016" fill="#F2D898" />

    <!-- Author Byline -->
    <text x="1200" y="2100" font-family="Baskerville, 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="62" font-weight="bold" fill="#F7F1E1" text-anchor="middle" letter-spacing="10px">
      VESPER BLYTHE
    </text>

    <!-- Mid Divider with Small Lozenge -->
    <line x1="720" y1="2155" x2="1680" y2="2155" stroke="url(#brassHGrad)" stroke-width="1.5" />
    <circle cx="1200" cy="2155" r="5" fill="#F2D898" />

    <!-- Narrator Byline: Narrated by Annie Caldwell -->
    <text x="1200" y="2245" font-family="Baskerville, Georgia, serif" font-style="italic" font-size="48" fill="#F2D898" text-anchor="middle" letter-spacing="3px">
      Narrated by Annie Caldwell
    </text>

    <!-- Base Fine Rule -->
    <line x1="840" y1="2295" x2="1560" y2="2295" stroke="url(#brassHGrad)" stroke-width="1.2" opacity="0.8" />
  </g>
</svg>
